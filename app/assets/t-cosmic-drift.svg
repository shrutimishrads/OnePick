<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#151722"/>
      <stop offset="100%" stop-color="#24142a"/>
    </linearGradient>
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0245e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e26d5c" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sunburst" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#001428" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#sunburst)"/>

  <!-- Comic Halftone & Web Graphic Lattice -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="0" x2="960" y2="540"/>
    <line x1="960" y1="0" x2="0" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <circle cx="480" cy="270" r="120" fill="none"/>
    <circle cx="480" cy="270" r="220" fill="none"/>
    <circle cx="480" cy="270" r="320" fill="none"/>
  </g>

  <!-- Chromatic Neon Streaks -->
  <path d="M 120 480 L 380 180 L 580 340 L 880 80" fill="none" stroke="url(#spiderGlow)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 115 485 L 375 185 L 575 345 L 875 85" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.5"/>

  <!-- Stylized Multiverse Silhouette & Angles -->
  <polygon points="620,110 740,70 840,160 820,380 690,440 590,320" fill="#1b1c28" stroke="#e26d5c" stroke-width="2.5" opacity="0.7"/>
  <polygon points="600,130 720,90 810,170 790,360 670,410 580,310" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Geometric Emblem -->
  <g transform="translate(680, 240) scale(0.9)">
    <polygon points="0,-70 45,-15 25,65 -25,65 -45,-15" fill="#e0245e" opacity="0.85"/>
    <polygon points="0,-60 38,-12 20,55 -20,55 -38,-12" fill="#131419"/>
    <circle cx="0" cy="0" r="14" fill="#00f0ff" opacity="0.9"/>
  </g>

  <!-- Film Overlay Gradient for Contrast -->
  <rect width="960" height="540" fill="black" opacity="0.25"/>
</svg>
