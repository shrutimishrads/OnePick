<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="45%" stop-color="#1e2230"/>
      <stop offset="75%" stop-color="#733322"/>
      <stop offset="90%" stop-color="#c95a32"/>
      <stop offset="100%" stop-color="#e26d5c"/>
    </linearGradient>
    <radialGradient id="burner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="80%" stop-color="#e26d5c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Golden Hour High-Altitude Sky -->
  <rect width="960" height="540" fill="url(#skyGrad)"/>

  <!-- Jet Contrails / Vapor Trails -->
  <path d="M -50 360 Q 300 280 620 180 T 1000 120" stroke="#f4f1de" stroke-width="4" fill="none" opacity="0.35"/>
  <path d="M -50 375 Q 320 295 640 195 T 1000 135" stroke="#f4f1de" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- Supersonic Fighter Jet Silhouette -->
  <g transform="translate(620, 180) rotate(-18) scale(0.85)">
    <!-- Jet Body -->
    <path d="M 120 0 L 20 -15 L -60 -95 L -80 -95 L -60 -15 L -120 -20 L -140 -50 L -160 -50 L -150 -5 L -150 5 L -160 50 L -140 50 L -120 20 L -60 15 L -80 95 L -60 95 L 20 15 Z" fill="#0d0f14"/>
    <!-- Canopy Glow -->
    <ellipse cx="40" cy="0" rx="18" ry="5" fill="#f8fafc" opacity="0.3"/>
    <!-- Twin Afterburners -->
    <ellipse cx="-155" cy="-7" rx="22" ry="10" fill="url(#burner)"/>
    <ellipse cx="-155" cy="7" rx="22" ry="10" fill="url(#burner)"/>
  </g>

  <!-- Horizon Line & Cloud Layers -->
  <path d="M 0 460 Q 240 430 520 450 T 960 440 L 960 540 L 0 540 Z" fill="#0d0e13" opacity="0.95"/>
  <path d="M 0 480 Q 360 460 700 475 T 960 470 L 960 540 L 0 540 Z" fill="#07080a"/>

  <!-- Film Overlay Vignette -->
  <rect width="960" height="540" fill="black" opacity="0.2"/>
</svg>
