<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-t-ember-tide" gradientTransform="rotate(232)">
      <stop offset="0%" stop-color="#0e1724" />
      <stop offset="100%" stop-color="#2b1b17" />
    </linearGradient>
    <linearGradient id="overlay-t-ember-tide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow-t-ember-tide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="900" fill="url(#bg-t-ember-tide)" />

  <!-- Deterministic Abstract Geometric Layer -->
  <g id="geometry-t-ember-tide">
    <circle cx="400" cy="269" r="172" fill="#f4a261" opacity="0.32" filter="url(#glow-t-ember-tide)" />
    <circle cx="490" cy="353" r="132" fill="#e76f51" opacity="0.15" filter="url(#glow-t-ember-tide)" />
    <rect x="291.5" y="430" width="243" height="176" rx="16" transform="rotate(0 413 518)" fill="#e9c46a" opacity="0.44" />
    <circle cx="238" cy="466" r="78" fill="none" stroke="#f4a261" stroke-width="2" opacity="0.64" />
    <rect x="38.5" y="359" width="225" height="154" rx="16" transform="rotate(27 151 436)" fill="#e76f51" opacity="0.40" />
  </g>

  <!-- Gradient Vignette Overlay -->
  <rect width="600" height="900" fill="url(#overlay-t-ember-tide)" />

  <!-- 5% Safe Margin Content (x: 30..570, y: 45..855) -->

  <!-- Top Metadata Header -->
  <text x="300" y="70" text-anchor="middle" fill="#f4a261" font-family="'Sora', sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    2021 • PG-13 • 111 MIN
  </text>
  <text x="300" y="92" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'Sora', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    DRAMA • MUSIC • COMEDY
  </text>

  <!-- Decorative Minimal Grid Crosses -->
  <path d="M 45 60 L 55 60 M 50 55 L 50 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 60 L 555 60 M 550 55 L 550 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 45 845 L 55 845 M 50 840 L 50 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 845 L 555 845 M 550 840 L 550 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Title Heading -->
  <text text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Sora', sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
    <tspan x="300" y="660">Ember Tide</tspan>
  </text>

  <!-- Title Accent Dash -->
  <line x1="260" y1="718" x2="340" y2="718" stroke="#e76f51" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline Text -->
  <text x="300" y="742" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Sora', sans-serif" font-size="15" font-weight="400" font-style="italic">
    "The oldest melodies guide the farthest voyages."
  </text>
</svg>
