<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-t-quarry-sprites" gradientTransform="rotate(31)">
      <stop offset="0%" stop-color="#0c1329" />
      <stop offset="100%" stop-color="#2b103b" />
    </linearGradient>
    <linearGradient id="overlay-t-quarry-sprites" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow-t-quarry-sprites" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="900" fill="url(#bg-t-quarry-sprites)" />

  <!-- Deterministic Abstract Geometric Layer -->
  <g id="geometry-t-quarry-sprites">
    <circle cx="439" cy="479" r="98" fill="#ffb703" opacity="0.27" filter="url(#glow-t-quarry-sprites)" />
    <rect x="281" y="398.5" width="250" height="151" rx="16" transform="rotate(3 406 474)" fill="#fb8500" opacity="0.43" />
    <rect x="70" y="301" width="148" height="124" rx="16" transform="rotate(26 144 363)" fill="#f72585" opacity="0.70" />
    <circle cx="151" cy="462" r="152" fill="#ffb703" opacity="0.27" filter="url(#glow-t-quarry-sprites)" />
    <circle cx="350" cy="258" r="100" fill="none" stroke="#fb8500" stroke-width="3" opacity="0.30" />
    <circle cx="468" cy="268" r="207" fill="#f72585" opacity="0.21" filter="url(#glow-t-quarry-sprites)" />
  </g>

  <!-- Gradient Vignette Overlay -->
  <rect width="600" height="900" fill="url(#overlay-t-quarry-sprites)" />

  <!-- 5% Safe Margin Content (x: 30..570, y: 45..855) -->

  <!-- Top Metadata Header -->
  <text x="300" y="70" text-anchor="middle" fill="#ffb703" font-family="'Sora', sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    2022 • PG • 93 MIN
  </text>
  <text x="300" y="92" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'Sora', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    ANIMATION • COMEDY • ADVENTURE
  </text>

  <!-- Decorative Minimal Grid Crosses -->
  <path d="M 45 60 L 55 60 M 50 55 L 50 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 60 L 555 60 M 550 55 L 550 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 45 845 L 55 845 M 50 840 L 50 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 845 L 555 845 M 550 840 L 550 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Title Heading -->
  <text text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Sora', sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
    <tspan x="300" y="660">Quarry Sprites</tspan>
  </text>

  <!-- Title Accent Dash -->
  <line x1="260" y1="718" x2="340" y2="718" stroke="#fb8500" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline Text -->
  <text x="300" y="742" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Sora', sans-serif" font-size="15" font-weight="400" font-style="italic">
    "Crafted from clay, fueled by pure stubbornness."
  </text>
</svg>
