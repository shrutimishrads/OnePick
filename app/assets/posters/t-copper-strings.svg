<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-t-copper-strings" gradientTransform="rotate(358)">
      <stop offset="0%" stop-color="#11141a" />
      <stop offset="100%" stop-color="#241b21" />
    </linearGradient>
    <linearGradient id="overlay-t-copper-strings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow-t-copper-strings" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="900" fill="url(#bg-t-copper-strings)" />

  <!-- Deterministic Abstract Geometric Layer -->
  <g id="geometry-t-copper-strings">
    <circle cx="397" cy="487" r="154" fill="none" stroke="#e26d5c" stroke-width="8" opacity="0.53" />
    <circle cx="345" cy="408" r="138" fill="#c9ada7" opacity="0.29" filter="url(#glow-t-copper-strings)" />
    <circle cx="343" cy="502" r="110" fill="none" stroke="#9a8c98" stroke-width="5" opacity="0.44" />
    <rect x="0" y="230" width="226" height="128" rx="16" transform="rotate(-22 113 294)" fill="#e26d5c" opacity="0.32" />
    <circle cx="261" cy="318" r="149" fill="none" stroke="#c9ada7" stroke-width="3" opacity="0.26" />
    <circle cx="444" cy="202" r="129" fill="#9a8c98" opacity="0.24" filter="url(#glow-t-copper-strings)" />
  </g>

  <!-- Gradient Vignette Overlay -->
  <rect width="600" height="900" fill="url(#overlay-t-copper-strings)" />

  <!-- 5% Safe Margin Content (x: 30..570, y: 45..855) -->

  <!-- Top Metadata Header -->
  <text x="300" y="70" text-anchor="middle" fill="#e26d5c" font-family="'Sora', sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    2022 • PG-13 • 100 MIN
  </text>
  <text x="300" y="92" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'Sora', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    DRAMA • MUSIC
  </text>

  <!-- Decorative Minimal Grid Crosses -->
  <path d="M 45 60 L 55 60 M 50 55 L 50 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 60 L 555 60 M 550 55 L 550 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 45 845 L 55 845 M 50 840 L 50 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 845 L 555 845 M 550 840 L 550 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Title Heading -->
  <text text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Sora', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    <tspan x="300" y="635">Copper Wire</tspan><tspan x="300" y="685">Orchestra</tspan>
  </text>

  <!-- Title Accent Dash -->
  <line x1="260" y1="736" x2="340" y2="736" stroke="#c9ada7" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline Text -->
  <text x="300" y="760" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Sora', sans-serif" font-size="15" font-weight="400" font-style="italic">
    "Music forged from scrap and perseverance."
  </text>
</svg>
