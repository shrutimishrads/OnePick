<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-t-knives-out" gradientTransform="rotate(121)">
      <stop offset="0%" stop-color="#081214" />
      <stop offset="100%" stop-color="#0f2427" />
    </linearGradient>
    <linearGradient id="overlay-t-knives-out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow-t-knives-out" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="900" fill="url(#bg-t-knives-out)" />

  <!-- Deterministic Abstract Geometric Layer -->
  <g id="geometry-t-knives-out">
    <circle cx="323" cy="329" r="218" fill="#52b788" opacity="0.18" filter="url(#glow-t-knives-out)" />
    <rect x="254" y="135.5" width="178" height="183" rx="16" transform="rotate(-7 343 227)" fill="#74c69d" opacity="0.48" />
    <circle cx="242" cy="219" r="184" fill="#b7e4c7" opacity="0.31" filter="url(#glow-t-knives-out)" />
    <rect x="276" y="256.5" width="258" height="243" rx="16" transform="rotate(-42 405 378)" fill="#52b788" opacity="0.33" />
    <circle cx="497" cy="528" r="165" fill="none" stroke="#74c69d" stroke-width="9" opacity="0.31" />
  </g>

  <!-- Gradient Vignette Overlay -->
  <rect width="600" height="900" fill="url(#overlay-t-knives-out)" />

  <!-- 5% Safe Margin Content (x: 30..570, y: 45..855) -->

  <!-- Top Metadata Header -->
  <text x="300" y="70" text-anchor="middle" fill="#52b788" font-family="'Sora', sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    2022 • PG-13 • 139 MIN
  </text>
  <text x="300" y="92" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'Sora', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    MYSTERY • COMEDY • DRAMA
  </text>

  <!-- Decorative Minimal Grid Crosses -->
  <path d="M 45 60 L 55 60 M 50 55 L 50 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 60 L 555 60 M 550 55 L 550 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 45 845 L 55 845 M 50 840 L 50 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 845 L 555 845 M 550 840 L 550 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Title Heading -->
  <text text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Sora', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    <tspan x="300" y="635">The Glass</tspan><tspan x="300" y="685">Solarium</tspan>
  </text>

  <!-- Title Accent Dash -->
  <line x1="260" y1="736" x2="340" y2="736" stroke="#74c69d" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline Text -->
  <text x="300" y="760" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Sora', sans-serif" font-size="15" font-weight="400" font-style="italic">
    "Every secret leaves a reflection."
  </text>
</svg>
