<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-t-interstellar" gradientTransform="rotate(1)">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#1e082b" />
    </linearGradient>
    <linearGradient id="overlay-t-interstellar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow-t-interstellar" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="900" fill="url(#bg-t-interstellar)" />

  <!-- Deterministic Abstract Geometric Layer -->
  <g id="geometry-t-interstellar">
    <circle cx="245" cy="398" r="154" fill="#00f2fe" opacity="0.20" filter="url(#glow-t-interstellar)" />
    <circle cx="404" cy="210" r="123" fill="#9d4edd" opacity="0.29" filter="url(#glow-t-interstellar)" />
    <circle cx="436" cy="268" r="200" fill="#4cc9f0" opacity="0.29" filter="url(#glow-t-interstellar)" />
    <rect x="172" y="448" width="158" height="98" rx="16" transform="rotate(-13 251 497)" fill="#00f2fe" opacity="0.39" />
    <circle cx="490" cy="393" r="149" fill="none" stroke="#9d4edd" stroke-width="9" opacity="0.64" />
  </g>

  <!-- Gradient Vignette Overlay -->
  <rect width="600" height="900" fill="url(#overlay-t-interstellar)" />

  <!-- 5% Safe Margin Content (x: 30..570, y: 45..855) -->

  <!-- Top Metadata Header -->
  <text x="300" y="70" text-anchor="middle" fill="#00f2fe" font-family="'Sora', sans-serif" font-size="14" font-weight="700" letter-spacing="4">
    2014 • PG-13 • 169 MIN
  </text>
  <text x="300" y="92" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'Sora', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    SCI-FI • DRAMA • ADVENTURE
  </text>

  <!-- Decorative Minimal Grid Crosses -->
  <path d="M 45 60 L 55 60 M 50 55 L 50 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 60 L 555 60 M 550 55 L 550 65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 45 845 L 55 845 M 50 840 L 50 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <path d="M 545 845 L 555 845 M 550 840 L 550 850" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Title Heading -->
  <text text-anchor="middle" fill="#ffffff" font-family="'Syne', 'Sora', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    <tspan x="300" y="635">Beyond the Event</tspan><tspan x="300" y="685">Horizon</tspan>
  </text>

  <!-- Title Accent Dash -->
  <line x1="260" y1="736" x2="340" y2="736" stroke="#9d4edd" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline Text -->
  <text x="300" y="760" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Sora', sans-serif" font-size="15" font-weight="400" font-style="italic">
    "Love is the one gravity across all worlds."
  </text>
</svg>
