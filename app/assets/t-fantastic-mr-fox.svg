<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="foxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141110"/>
      <stop offset="60%" stop-color="#2d1c16"/>
      <stop offset="100%" stop-color="#542c1b"/>
    </linearGradient>
    <linearGradient id="ochreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
  </defs>

  <!-- Autumn Forest Night Backdrop -->
  <rect width="960" height="540" fill="url(#foxBg)"/>

  <!-- Moon Glow -->
  <circle cx="700" cy="160" r="90" fill="#fefae0" opacity="0.12"/>
  <circle cx="700" cy="160" r="70" fill="#fefae0" opacity="0.25"/>

  <!-- Stylized Geometric Fox Silhouette -->
  <g transform="translate(680, 290) scale(0.95)">
    <!-- Fox Body & Tail -->
    <path d="M -60 120 C -40 40 20 20 80 50 C 140 80 180 120 180 140 L -80 140 Z" fill="#d4714d"/>
    <!-- Large Bushy Tail -->
    <path d="M 120 80 C 180 40 240 70 230 110 C 220 140 180 140 150 140 Z" fill="#b8532f"/>
    <path d="M 215 100 C 235 110 230 130 210 135 Z" fill="#faedcd"/>
    <!-- Head & Ears -->
    <polygon points="10,20 -15,-40 25,-15" fill="#b8532f"/>
    <polygon points="40,15 70,-40 50,-10" fill="#b8532f"/>
    <polygon points="-5,10 50,0 20,55" fill="#e07a5f"/>
    <!-- White Muzzle -->
    <polygon points="15,40 25,40 20,55" fill="#faedcd"/>
    <!-- Corduroy Suit Accent -->
    <polygon points="-20,50 35,45 25,110 -25,110" fill="#cc8b3c" opacity="0.85"/>
  </g>

  <!-- Wes Anderson Style Rolling Terracotta Hills -->
  <path d="M 0 380 Q 250 340 500 370 T 960 360 L 960 540 L 0 540 Z" fill="#241913"/>
  <path d="M 0 430 Q 300 400 650 420 T 960 410 L 960 540 L 0 540 Z" fill="#17110e"/>

  <!-- Woodland Trees Silhouette -->
  <g fill="#17110e" opacity="0.6">
    <polygon points="120,380 140,290 160,380"/>
    <polygon points="170,390 185,310 200,390"/>
    <polygon points="280,385 305,270 330,385"/>
    <polygon points="340,395 355,320 370,395"/>
    <polygon points="450,380 470,285 490,380"/>
  </g>

  <rect width="960" height="540" fill="black" opacity="0.2"/>
</svg>
